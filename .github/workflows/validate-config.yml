name: validate-config

# Catch a bad containers.yml entry on push instead of four days later, when the
# weekly build for that app silently never happens.

on:
  push:
    paths: [containers.yml, scripts/plan.py, .github/workflows/**]
  pull_request:
    paths: [containers.yml, scripts/plan.py, .github/workflows/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - run: python -m pip install --quiet pyyaml

      - name: Schema plus upstream Dockerfile check
        run: python scripts/plan.py --validate
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Preview what the next weekly run would build
        env:
          IMAGE_OWNER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "| app | builds | tags |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          while read -r app; do
            python scripts/plan.py --resolve "$app" > "$app.env"
            version=$(sed -n 's/^version=//p' "$app.env")
            tags=$(sed -n 's/^tags=//p' "$app.env")
            upstream=$(sed -n 's/^upstream=//p' "$app.env")
            echo "| $app | $upstream @ \`$version\` | \`$tags\` |" >> "$GITHUB_STEP_SUMMARY"
          done < <(python scripts/plan.py --list)
